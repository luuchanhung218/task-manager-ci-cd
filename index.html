
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Task Manager Dashboard</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
    }

    section {
      background: #f4f6fa;
      padding: 18px;
      margin-bottom: 20px;
      border-radius: 8px;
    }

    pre {
      white-space: pre-wrap;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <h1>My Task Manager Dashboard</h1>

  <section>
    <h2>ToDo Tasks</h2>
    <pre id="pending">Waiting for workflow...</pre>
  </section>

  <section>
    <h2>Done Tasks</h2>
    <pre id="completed">Waiting for workflow...</pre>
  </section>

  <section>
    <h2>Unit Test Results</h2>
    <pre id="unittest">Waiting for workflow...</pre>
  </section>
</body>
</html>
